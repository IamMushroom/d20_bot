name: Push image
on: 
  workflow_dispatch:
  push:
    tags: 
      - "*.*.*"

jobs:
  tests:
    uses: ./.github/workflows/tests.yaml

  build-and-push:
    needs: tests
    outputs:
      release-tag: ${{ steps.version.outputs.version }}
    runs-on: [self-hosted, raspberry]
    environment: prd
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Verify release version
        id: version
        shell: bash
        run: |
          PROJECT_VERSION=$(awk -F'"' '/^version = "/ { print $2; exit }' pyproject.toml)
          TAG_VERSION=${GITHUB_REF_NAME#v}
          if [[ "$PROJECT_VERSION" != "$TAG_VERSION" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match project version $PROJECT_VERSION"
            exit 1
          fi
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          # list of Docker images to use as base name for tags
          images: |
            immushroom/d20_bot
            ghcr.io/IamMushroom/d20_bot
          # generate Docker tags based on the following events/attributes
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_HUB_NAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/arm64
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign images
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        shell: bash
        run: |
          while IFS= read -r IMAGE; do
            cosign sign --yes "${IMAGE}@${DIGEST}"
          done <<< "$TAGS"

  release:
    needs: build-and-push
    runs-on: [self-hosted, raspberry]
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          curl --fail-with-body \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases" \
            --data "{\"tag_name\":\"${GITHUB_REF_NAME}\",\"name\":\"D20 Bot ${GITHUB_REF_NAME}\",\"generate_release_notes\":true}"

  deploy-production:
    needs: [build-and-push, release]
    runs-on: [self-hosted, raspberry]
    environment: prd
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Pull release image
        env:
          DOCKER_TAG: ${{ needs.build-and-push.outputs.release-tag }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
        run: docker compose -p d20_bot_prd pull d20

      - name: Deploy release image
        env:
          DOCKER_TAG: ${{ needs.build-and-push.outputs.release-tag }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
        run: >-
          docker compose
          -p d20_bot_prd
          up -d --no-build --remove-orphans

      - name: Verify deployment
        env:
          DOCKER_TAG: ${{ needs.build-and-push.outputs.release-tag }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
        shell: bash
        run: |
          CONTAINER_ID=$(docker compose -p d20_bot_prd ps -q d20)
          if [[ -z "$CONTAINER_ID" ]]; then
            docker compose -p d20_bot_prd logs --no-color d20
            exit 1
          fi
          sleep 10
          if [[ "$(docker inspect --format '{{.State.Running}}' "$CONTAINER_ID")" == "true" ]]; then
            exit 0
          fi
          docker inspect --format '{{json .State}}' "$CONTAINER_ID"
          docker compose -p d20_bot_prd logs --no-color d20
          exit 1

      - name: Prune unused images
        run: docker image prune --force
