name: Push image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example 0.11.2
        required: true
        type: string
  push:
    tags:
      - "*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/tests.yaml
    with:
      checkout_ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

  build-and-push:
    needs: tests
    outputs:
      release_tag: ${{ steps.version.outputs.version }}
      git_tag: ${{ steps.version.outputs.git_tag }}
    runs-on: [self-hosted, raspberry]
    environment: prd
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Verify release version
        id: version
        shell: bash
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
        run: |
          PROJECT_VERSION=$(awk -F'"' '/^version = "/ { print $2; exit }' pyproject.toml)
          TAG_VERSION=${REQUESTED_TAG#v}
          if [[ ! "$TAG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Unsupported release tag: $REQUESTED_TAG"
            exit 1
          fi
          if [[ "$PROJECT_VERSION" != "$TAG_VERSION" ]]; then
            echo "Release tag $REQUESTED_TAG does not match project version $PROJECT_VERSION"
            exit 1
          fi
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
          echo "git_tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          # list of Docker images to use as base name for tags
          images: |
            immushroom/d20_bot
            ghcr.io/IamMushroom/d20_bot
          # generate Docker tags based on the following events/attributes
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.version }}
            type=sha
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_HUB_NAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/arm64
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign images
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        shell: bash
        run: |
          while IFS= read -r IMAGE; do
            cosign sign --yes "${IMAGE}@${DIGEST}"
          done <<< "$TAGS"

  release:
    needs: build-and-push
    runs-on: [self-hosted, raspberry]
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG_NAME='${{ needs.build-and-push.outputs.git_tag }}'
          if curl --silent --fail \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG_NAME}" \
            >/dev/null; then
            echo "GitHub Release for $TAG_NAME already exists"
            exit 0
          fi
          curl --fail-with-body \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases" \
            --data "{\"tag_name\":\"${TAG_NAME}\",\"name\":\"D20 Bot ${TAG_NAME}\",\"generate_release_notes\":true}"

  deploy-production:
    needs: [build-and-push, release]
    runs-on: [self-hosted, raspberry]
    timeout-minutes: 20
    environment: prd
    env:
      COMPOSE_PROFILES: ${{ vars.D20_MODE == 'connected' && 'platform' || '' }}
      D20_BOT_MODE: ${{ vars.D20_MODE }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Pull release image
        env:
          D20_BOT_DOCKER_TAG: ${{ needs.build-and-push.outputs.release_tag }}
          D20_BOT_TG_TOKEN: ${{ secrets.TG_TOKEN }}
        shell: bash
        run: |
          docker compose -p d20_bot_prd config --quiet
          docker compose -p d20_bot_prd pull d20

      - name: Deploy release image
        env:
          D20_BOT_DOCKER_TAG: ${{ needs.build-and-push.outputs.release_tag }}
          D20_BOT_TG_TOKEN: ${{ secrets.TG_TOKEN }}
        run: >-
          docker compose
          -p d20_bot_prd
          up -d --no-build --remove-orphans

      - name: Verify deployment
        env:
          D20_BOT_DOCKER_TAG: ${{ needs.build-and-push.outputs.release_tag }}
          D20_BOT_TG_TOKEN: ${{ secrets.TG_TOKEN }}
        shell: bash
        run: |
          for ATTEMPT in {1..12}; do
            FAILED=0
            while IFS= read -r SERVICE; do
              CONTAINER_ID=$(docker compose -p d20_bot_prd ps -q "$SERVICE")
              RUNNING=$(docker inspect --format '{{.State.Running}}' "$CONTAINER_ID" 2>/dev/null || true)
              RESTARTING=$(docker inspect --format '{{.State.Restarting}}' "$CONTAINER_ID" 2>/dev/null || true)
              HEALTH=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$CONTAINER_ID" 2>/dev/null || true)
              if [[ "$RUNNING" != "true" ]] || [[ "$RESTARTING" == "true" ]] || \
                [[ "$HEALTH" == "unhealthy" ]] || [[ "$HEALTH" == "starting" ]]; then
                FAILED=1
              fi
            done < <(docker compose -p d20_bot_prd config --services)
            [[ "$FAILED" -eq 0 ]] && exit 0
            sleep 5
          done
          docker compose -p d20_bot_prd ps
          docker compose -p d20_bot_prd logs --no-color --tail 100
          exit 1
