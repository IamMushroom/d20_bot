name: Run bot

on:
  push:
    paths-ignore:
      - '**/README.md'
      - '.github/workflows/push_image.yaml'

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yaml

  deploy:
    needs: tests
    runs-on: [self-hosted, raspberry]
    environment:
      name: ${{ github.ref_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set deployment variables
        id: variables
        shell: bash
        run: |
          PROJECT=$(echo "$GITHUB_REF_NAME" | tr '/[:upper:]' '_[:lower:]')
          if [[ "$GITHUB_REF_NAME" == "dev" ]]; then
            TAG=$(git rev-parse --short "$GITHUB_SHA")
          else
            TAG=latest
          fi
          echo "project=d20_bot_${PROJECT}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: docker build --tag "immushroom/d20_bot:${{ steps.variables.outputs.tag }}" .

      - name: Deploy
        env:
          DOCKER_TAG: ${{ steps.variables.outputs.tag }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
        run: >-
          docker compose
          -p "${{ steps.variables.outputs.project }}"
          up -d --remove-orphans

      - name: Prune unused images
        run: docker image prune --force
