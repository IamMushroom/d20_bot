name: Run bot

on:
  push:
    branches:
      - dev
      - prd
    paths-ignore:
      - '**/README.md'
      - '.github/workflows/push_image.yaml'

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/tests.yaml

  deploy:
    needs: tests
    runs-on: [self-hosted, raspberry]
    environment:
      name: ${{ github.ref_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set deployment variables
        id: variables
        shell: bash
        run: |
          PROJECT=$(echo "$GITHUB_REF_NAME" | tr '/[:upper:]' '_[:lower:]')
          if [[ "$GITHUB_REF_NAME" == "dev" ]]; then
            TAG=$(git rev-parse --short "$GITHUB_SHA")
          else
            TAG=latest
          fi
          echo "project=d20_bot_${PROJECT}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: docker build --tag "immushroom/d20_bot:${{ steps.variables.outputs.tag }}" .

      - name: Deploy
        env:
          DOCKER_TAG: ${{ steps.variables.outputs.tag }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
        run: >-
          docker compose
          -p "${{ steps.variables.outputs.project }}"
          up -d --remove-orphans

      - name: Verify deployment
        env:
          COMPOSE_PROJECT: ${{ steps.variables.outputs.project }}
          DOCKER_TAG: ${{ steps.variables.outputs.tag }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
        shell: bash
        run: |
          CONTAINER_ID=$(docker compose -p "$COMPOSE_PROJECT" ps -q d20)
          if [[ -z "$CONTAINER_ID" ]]; then
            docker compose -p "$COMPOSE_PROJECT" logs --no-color d20
            exit 1
          fi
          sleep 10
          if [[ "$(docker inspect --format '{{.State.Running}}' "$CONTAINER_ID")" == "true" ]]; then
            exit 0
          fi
          docker inspect --format '{{json .State}}' "$CONTAINER_ID"
          docker compose -p "$COMPOSE_PROJECT" logs --no-color d20
          exit 1

      - name: Prune unused images
        run: docker image prune --force
