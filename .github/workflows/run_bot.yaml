name: Run bot

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/run_bot.yaml'
      - '.github/workflows/tests.yaml'
      - 'src/**'
      - 'migrations/**'
      - 'Dockerfile'
      - 'Dockerfile.sqlite-web'
      - 'docker-compose.yaml'
      - 'pyproject.toml'
      - 'pytest.ini'
      - 'uv.lock'

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  # Never interrupt docker compose halfway through replacing containers.
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/tests.yaml

  deploy:
    needs: tests
    runs-on: [self-hosted, raspberry]
    timeout-minutes: 20
    env:
      COMPOSE_PROFILES: ${{ vars.D20_MODE == 'connected' && 'platform,debug' || 'debug' }}
    environment:
      name: ${{ github.ref_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set deployment variables
        id: variables
        shell: bash
        run: |
          PROJECT=$(echo "$GITHUB_REF_NAME" | tr '/[:upper:]' '_[:lower:]')
          TAG=$(git rev-parse --short "$GITHUB_SHA")
          echo "project=d20_bot_${PROJECT}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: >-
          docker build
          --label io.d20-bot.ci-environment=dev
          --tag "immushroom/d20_bot:${{ steps.variables.outputs.tag }}"
          .

      - name: Deploy
        env:
          D20_BOT_DOCKER_TAG: ${{ steps.variables.outputs.tag }}
          D20_BOT_TG_TOKEN: ${{ secrets.TG_TOKEN }}
          D20_BOT_MODE: ${{ vars.D20_MODE }}
          D20_BOT_CORE_TOKEN: ${{ secrets.CORE_TOKEN }}
        shell: bash
        run: |
          docker compose -p "${{ steps.variables.outputs.project }}" config --quiet
          docker compose -p "${{ steps.variables.outputs.project }}" up -d --remove-orphans

      - name: Verify deployment
        env:
          COMPOSE_PROJECT: ${{ steps.variables.outputs.project }}
          D20_BOT_DOCKER_TAG: ${{ steps.variables.outputs.tag }}
          D20_BOT_TG_TOKEN: ${{ secrets.TG_TOKEN }}
          D20_BOT_MODE: ${{ vars.D20_MODE }}
          D20_BOT_CORE_TOKEN: ${{ secrets.CORE_TOKEN }}
        shell: bash
        run: |
          for ATTEMPT in {1..12}; do
            FAILED=0
            while IFS= read -r SERVICE; do
              CONTAINER_ID=$(docker compose -p "$COMPOSE_PROJECT" ps -aq "$SERVICE")
              ONESHOT=$(docker inspect --format '{{index .Config.Labels "io.d20-bot.verify"}}' "$CONTAINER_ID" 2>/dev/null || true)
              if [[ "$ONESHOT" == "oneshot" ]]; then
                EXIT_CODE=$(docker inspect --format '{{.State.ExitCode}}' "$CONTAINER_ID" 2>/dev/null || true)
                [[ "$EXIT_CODE" == "0" ]] || FAILED=1
                continue
              fi
              RUNNING=$(docker inspect --format '{{.State.Running}}' "$CONTAINER_ID" 2>/dev/null || true)
              RESTARTING=$(docker inspect --format '{{.State.Restarting}}' "$CONTAINER_ID" 2>/dev/null || true)
              HEALTH=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$CONTAINER_ID" 2>/dev/null || true)
              if [[ "$RUNNING" != "true" ]] || [[ "$RESTARTING" == "true" ]] || \
                [[ "$HEALTH" == "unhealthy" ]] || [[ "$HEALTH" == "starting" ]]; then
                FAILED=1
              fi
            done < <(docker compose -p "$COMPOSE_PROJECT" config --services)
            [[ "$FAILED" -eq 0 ]] && exit 0
            sleep 5
          done
          docker compose -p "$COMPOSE_PROJECT" ps
          docker compose -p "$COMPOSE_PROJECT" logs --no-color --tail 100
          exit 1

      - name: Remove old dev images
        run: >-
          docker image prune --all --force
          --filter label=io.d20-bot.ci-environment=dev
          --filter until=168h
