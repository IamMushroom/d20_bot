name: Tests & Ruff

on:
  workflow_call:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, raspberry]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Ruff and pytest in Python 3.14
        run: docker build --target test --tag d20-bot:test .

      - name: Build runtime image
        run: docker build --tag d20-bot:runtime-test .

      - name: Scan runtime image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: d20-bot:runtime-test
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
