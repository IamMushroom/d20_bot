{{- if .Values.core.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "d20-bot.fullname" . }}-core
  labels:
    {{- include "d20-bot.labels" . | nindent 4 }}
    app.kubernetes.io/component: core
spec:
  replicas: {{ .Values.core.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "d20-bot.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: core
  template:
    metadata:
      annotations:
        {{- toYaml .Values.core.podAnnotations | nindent 8 }}
      labels:
        {{- include "d20-bot.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: core
        {{- with .Values.core.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: core
          image: {{ include "d20-bot.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [".venv/bin/python", "src/run_core.py"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: D20_BOT_CORE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "d20-bot.secretName" . }}
                  key: D20_BOT_CORE_TOKEN
            - name: D20_BOT_LOG_FORMAT
              value: {{ .Values.core.logFormat | quote }}
            - name: D20_BOT_DATABASE_URL
              value: sqlite:////data/d20.sqlite3
            - name: D20_BOT_GAME_TIMEZONE
              value: {{ .Values.core.gameTimezone | quote }}
            - name: D20_BOT_FOUNDRY_URL
              value: {{ .Values.core.foundryUrl | quote }}
            - name: D20_BOT_WEB_BASE_URL
              value: {{ .Values.core.webBaseUrl | quote }}
            - name: D20_BOT_WEB_HOST
              value: 0.0.0.0
            - name: D20_BOT_WEB_PORT
              value: {{ .Values.core.service.port | quote }}
            - name: D20_BOT_WEB_SECURE_COOKIE
              value: {{ .Values.core.secureCookie | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.core.service.port }}
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.core.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /data
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
        - name: data
          {{- if .Values.core.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "d20-bot.pvcName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
