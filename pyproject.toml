[project]
name = "d20-bot"
version = "0.13.0"
description = "Telegram dice bot for tabletop role-playing games"
requires-python = ">=3.14"
dependencies = [
    "jinja2==3.1.6",
    "python-dotenv==1.2.2",
    "python-telegram-bot==22.8",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.15.22",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "single"
