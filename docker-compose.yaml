services:
  d20:
    image: immushroom/d20_bot:${DOCKER_TAG:-latest}
    build: .
    init: true
    read_only: true
    environment:
      TG_TOKEN: ${TG_TOKEN:?Set TG_TOKEN in .env}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/d20.sqlite3}
      GAME_TIMEZONE: ${GAME_TIMEZONE:-Europe/Moscow}
      FOUNDRY_URL: ${FOUNDRY_URL:-}
    volumes:
      - d20-data:/data
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 150M
        reservations:
          memory: 20M

  sqlite-web:
    image: d20-sqlite-web:local
    build:
      context: .
      dockerfile: Dockerfile.sqlite-web
    profiles: [debug]
    command: [d20.sqlite3, --host, 0.0.0.0, --port, "8080", --foreign-keys]
    read_only: true
    volumes:
      - d20-data:/data
    tmpfs:
      - /tmp:size=16m,mode=1777
    ports:
      - ${SQLITE_WEB_PORT:-8080}:8080
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  d20-data:
