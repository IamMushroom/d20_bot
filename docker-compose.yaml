services:
  data-init:
    image: immushroom/d20_bot:${D20_BOT_DOCKER_TAG:-latest}
    build: .
    profiles: [platform]
    user: root
    command: [chown, -R, "10001:10001", /data]
    volumes:
      - d20-data:/data
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    restart: "no"
    labels:
      io.d20-bot.verify: oneshot

  database-backup:
    image: immushroom/d20_bot:${D20_BOT_DOCKER_TAG:-latest}
    profiles: [maintenance]
    command: [.venv/bin/python, src/backup_database.py]
    environment:
      D20_BOT_LOG_FORMAT: ${D20_BOT_LOG_FORMAT:-json}
      D20_BOT_BACKUP_KEEP: ${D20_BOT_BACKUP_KEEP:-10}
    volumes:
      - d20-data:/data:ro
      - d20-backups:/backups
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"

  d20:
    image: immushroom/d20_bot:${D20_BOT_DOCKER_TAG:-latest}
    build: .
    init: true
    read_only: true
    environment:
      D20_BOT_TG_TOKEN: ${D20_BOT_TG_TOKEN:?Set D20_BOT_TG_TOKEN in .env}
      D20_BOT_MODE: ${D20_BOT_MODE:-standalone}
      D20_BOT_LOG_FORMAT: ${D20_BOT_LOG_FORMAT:-json}
      D20_BOT_CORE_URL: ${D20_BOT_CORE_URL:-http://core:8190}
      D20_BOT_CORE_TOKEN: ${D20_BOT_CORE_TOKEN:-}
      D20_BOT_GAME_TIMEZONE: ${D20_BOT_GAME_TIMEZONE:-Europe/Moscow}
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 100M
        reservations:
          memory: 20M

  core:
    image: immushroom/d20_bot:${D20_BOT_DOCKER_TAG:-latest}
    build: .
    profiles: [platform]
    command: [.venv/bin/python, src/run_core.py]
    depends_on:
      data-init:
        condition: service_completed_successfully
    init: true
    read_only: true
    environment:
      D20_BOT_CORE_TOKEN: ${D20_BOT_CORE_TOKEN:-}
      D20_BOT_LOG_FORMAT: ${D20_BOT_LOG_FORMAT:-json}
      D20_BOT_DATABASE_URL: ${D20_BOT_DATABASE_URL:-sqlite:////data/d20.sqlite3}
      D20_BOT_GAME_TIMEZONE: ${D20_BOT_GAME_TIMEZONE:-Europe/Moscow}
      D20_BOT_FOUNDRY_URL: ${D20_BOT_FOUNDRY_URL:-}
      D20_BOT_WEB_BASE_URL: ${D20_BOT_WEB_BASE_URL:-}
      D20_BOT_WEB_HOST: 0.0.0.0
      D20_BOT_WEB_PORT: 8190
      D20_BOT_WEB_SECURE_COOKIE: ${D20_BOT_WEB_SECURE_COOKIE:-auto}
    volumes:
      - d20-data:/data
    ports:
      - ${D20_BOT_WEB_PORT:-8190}:8190
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, wget, --quiet, --spider, http://127.0.0.1:8190/health]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 150M
        reservations:
          memory: 20M

  sqlite-web:
    image: d20-sqlite-web:local
    build:
      context: .
      dockerfile: Dockerfile.sqlite-web
    profiles: [debug]
    command: [d20.sqlite3, --host, 0.0.0.0, --port, "8080", --foreign-keys]
    read_only: true
    volumes:
      - d20-data:/data
    tmpfs:
      - /tmp:size=16m,mode=1777
    ports:
      - ${D20_BOT_SQLITE_WEB_PORT:-8080}:8080
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  d20-data:
  d20-backups:
