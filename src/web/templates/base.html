<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <script>
      (() => {
        const theme = localStorage.getItem('d20-theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      })();
    </script>
    <title>{% block title %}D20 Admin{% endblock %}</title>
    <style>
      :root {
        --bg: #100f16;
        --surface: #1a1823;
        --surface-raised: #24212f;
        --border: #373247;
        --text: #f4f1fb;
        --muted: #aaa4ba;
        --accent: #a98bff;
        --accent-strong: #c4b1ff;
        --success: #69d49a;
        --danger: #ff858f;
        --shadow: 0 18px 50px rgba(0, 0, 0, .28);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--text);
        background: var(--bg);
      }
      :root[data-theme="light"] {
        --bg: #f5f2fb; --surface: #ffffff; --surface-raised: #f8f6fc; --border: #d9d2e7;
        --text: #211b2d; --muted: #675f73; --accent: #7652d6; --accent-strong: #5e3fbd;
        --success: #18794e; --danger: #c93645; --shadow: 0 18px 45px rgba(45, 31, 72, .1);
        color-scheme: light;
      }
      :root[data-theme="dark"] { color-scheme: dark; }
      * { box-sizing: border-box; }
      body { min-width: 18rem; margin: 0; background: radial-gradient(circle at 80% -10%, color-mix(in srgb, var(--accent) 20%, transparent) 0, transparent 32rem), var(--bg); color: var(--text); }
      a { color: var(--accent-strong); }
      .site-header { border-bottom: 1px solid var(--border); background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(12px); }
      .site-header__inner, .page { width: min(100% - 2rem, 68rem); margin-inline: auto; }
      .site-header__inner { min-height: 4rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
      .brand { display: inline-flex; align-items: center; gap: .65rem; color: var(--text); font-weight: 800; text-decoration: none; letter-spacing: .02em; }
      .brand__mark { display: grid; place-items: center; width: 2rem; aspect-ratio: 1; border-radius: .65rem; background: linear-gradient(135deg, var(--accent), #6d4bd2); box-shadow: 0 8px 22px rgba(126, 91, 220, .35); }
      .nav-link { color: var(--muted); text-decoration: none; font-size: .92rem; }
      .nav-link:hover { color: var(--text); }
      .header-actions { display: flex; align-items: center; gap: .75rem; }
      .nav-form { display: block; }
      .nav-button { width: auto; min-height: auto; padding: 0; border-radius: 0; background: none; color: var(--muted); font-size: .92rem; font-weight: 400; }
      .nav-button:hover { color: var(--text); filter: none; }
      .theme-switcher { display: flex; padding: .2rem; border: 1px solid var(--border); border-radius: .7rem; background: var(--surface); }
      .theme-switcher button { width: auto; min-height: 2rem; padding: .3rem .5rem; border-radius: .5rem; background: transparent; color: var(--muted); font-size: .85rem; }
      .theme-switcher button[aria-pressed="true"] { background: var(--surface-raised); color: var(--text); box-shadow: 0 2px 8px rgba(0, 0, 0, .12); }
      .page { padding-block: clamp(1.5rem, 4vw, 3.5rem); }
      .hero { margin-bottom: 1.5rem; }
      .eyebrow { margin: 0 0 .4rem; color: var(--accent-strong); font-size: .78rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
      h1, h2, p { margin-top: 0; }
      h1 { margin-bottom: .45rem; font-size: clamp(1.75rem, 5vw, 2.75rem); line-height: 1.1; }
      h2 { margin-bottom: 1rem; font-size: 1.1rem; }
      .muted { color: var(--muted); }
      .grid { display: grid; gap: 1rem; }
      .card { min-width: 0; padding: clamp(1rem, 3vw, 1.4rem); border: 1px solid var(--border); border-radius: 1.15rem; background: linear-gradient(145deg, var(--surface-raised), var(--surface)); box-shadow: var(--shadow); }
      .card__header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1rem; }
      .card__header h2 { margin: 0; }
      .badge { display: inline-flex; align-items: center; gap: .4rem; padding: .3rem .62rem; border-radius: 999px; background: rgba(169, 139, 255, .13); color: var(--accent-strong); font-size: .78rem; font-weight: 750; white-space: nowrap; }
      .badge--success { background: rgba(105, 212, 154, .13); color: var(--success); }
      .schedule { padding: .85rem 1rem; border-left: 3px solid var(--accent); border-radius: .25rem .8rem .8rem .25rem; background: rgba(169, 139, 255, .08); line-height: 1.55; overflow-wrap: anywhere; }
      .empty { padding: 1rem; border: 1px dashed var(--border); border-radius: .8rem; color: var(--muted); text-align: center; }
      .roster { display: flex; flex-wrap: wrap; gap: .55rem; padding: 0; margin: 0; list-style: none; }
      .roster li { padding: .48rem .72rem; border-radius: .7rem; background: rgba(255, 255, 255, .055); }
      .roster--managed { display: grid; }
      .roster--managed li { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: .55rem; padding: .7rem; }
      .player-editor { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: .55rem; }
      .player-editor button, .player-remove button { width: auto; }
      .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
      form { display: grid; gap: .9rem; }
      label { display: grid; gap: .42rem; color: var(--muted); font-size: .88rem; font-weight: 650; }
      input, button { width: 100%; min-height: 2.8rem; border-radius: .75rem; font: inherit; }
      input, select { border: 1px solid var(--border); padding: .72rem .82rem; border-radius: .75rem; background: var(--surface); color: var(--text); outline: none; font: inherit; }
      input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(169, 139, 255, .16); }
      button { border: 0; padding: .72rem 1rem; background: linear-gradient(135deg, var(--accent), #8060df); color: #130d22; font-weight: 800; cursor: pointer; }
      button:hover { filter: brightness(1.08); }
      button:disabled { cursor: wait; filter: grayscale(.25); opacity: .72; }
      button:focus-visible, a:focus-visible { outline: 3px solid var(--accent-strong); outline-offset: 3px; }
      .button--danger { background: rgba(255, 133, 143, .12); color: var(--danger); border: 1px solid rgba(255, 133, 143, .3); }
      .message { max-width: 34rem; margin: clamp(2rem, 10vh, 7rem) auto; text-align: center; }
      .message__icon { display: grid; place-items: center; width: 3.5rem; margin: 0 auto 1rem; aspect-ratio: 1; border-radius: 1rem; background: rgba(169, 139, 255, .13); font-size: 1.6rem; }
      .message--error .message__icon { background: rgba(255, 133, 143, .12); }
      .message__actions { margin-top: 1.4rem; }
      .history { display: grid; gap: .65rem; padding: 0; margin: 0; list-style: none; }
      .history__item { display: grid; gap: .2rem; padding: .75rem .85rem; border-radius: .75rem; background: color-mix(in srgb, var(--text) 5%, transparent); }
      .history__title { font-weight: 750; }
      .history__dates { color: var(--muted); font-size: .82rem; }
      .campaign-link { display: grid; gap: .55rem; color: var(--text); text-decoration: none; }
      .campaign-link h2 { margin: 0; }
      .campaign-link:hover { border-color: var(--accent); transform: translateY(-1px); }
      .landing { display: grid; align-items: center; gap: 2rem; min-height: calc(100vh - 11rem); }
      .landing__copy { max-width: 42rem; }
      .landing__lead { max-width: 38rem; font-size: clamp(1.05rem, 2.5vw, 1.25rem); line-height: 1.65; }
      .landing__actions { display: flex; flex-wrap: wrap; gap: .75rem; margin: 1.5rem 0 1rem; }
      .landing__hint { max-width: 35rem; font-size: .9rem; }
      .landing__features { display: grid; gap: 1rem; }
      .landing__features .card { box-shadow: none; }
      .landing__features h2 { margin: .65rem 0 .4rem; }
      .landing__features p { margin-bottom: 0; line-height: 1.5; }
      .feature-icon { color: var(--accent-strong); font-size: 1.6rem; }
      .button-link { display: inline-flex; align-items: center; justify-content: center; min-height: 2.8rem; padding: .72rem 1.2rem; border-radius: .75rem; background: linear-gradient(135deg, var(--accent), #8060df); color: #130d22; font-weight: 800; text-decoration: none; }
      .button-link--secondary { border: 1px solid var(--border); background: var(--surface); color: var(--text); }
      .button-link:hover { filter: brightness(1.08); }
      @media (min-width: 48rem) {
        .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .card--wide { grid-column: 1 / -1; }
        .form-grid { grid-template-columns: 1fr 1.35fr; align-items: end; }
        .form-grid button { grid-column: 1 / -1; width: auto; justify-self: end; min-width: 14rem; }
        .landing { grid-template-columns: minmax(0, 1.35fr) minmax(18rem, .65fr); }
      }
      @media (prefers-reduced-motion: no-preference) {
        button, input, a { transition: color .16s ease, border-color .16s ease, box-shadow .16s ease, filter .16s ease; }
      }
      @media (prefers-color-scheme: light) {
        :root:not([data-theme]) {
          --bg: #f5f2fb; --surface: #ffffff; --surface-raised: #f8f6fc; --border: #d9d2e7;
          --text: #211b2d; --muted: #675f73; --accent: #7652d6; --accent-strong: #5e3fbd;
          --success: #18794e; --danger: #c93645; --shadow: 0 18px 45px rgba(45, 31, 72, .1);
          color-scheme: light;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__inner">
        <a class="brand" href="/"><span class="brand__mark">20</span><span>D20 Control</span></a>
        <div class="header-actions">
          {% if csrf_token|default(None) %}
            <a class="nav-link" href="/campaigns">Кампании</a>
            {% if campaign_chat_id|default(None) %}
              <a class="nav-link" href="/?campaign={{ campaign_chat_id }}">Панель</a>
              {% if role|default('master') == 'master' %}<a class="nav-link" href="/settings?campaign={{ campaign_chat_id }}">Настройки</a>{% endif %}
            {% endif %}
            <a class="nav-link" href="/sessions">Сессии</a>
            <form class="nav-form" method="post" action="/logout">
              <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
              <button class="nav-button" type="submit">Выйти</button>
            </form>
          {% endif %}
          <div class="theme-switcher" aria-label="Тема оформления">
            <button type="button" data-theme-choice="auto" title="Системная тема">◐</button>
            <button type="button" data-theme-choice="light" title="Светлая тема">☀</button>
            <button type="button" data-theme-choice="dark" title="Тёмная тема">☾</button>
          </div>
        </div>
      </div>
    </header>
    <main class="page">{% block content %}{% endblock %}</main>
    <script src="/static/app.js" defer></script>
  </body>
</html>
