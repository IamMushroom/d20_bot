<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>{% block title %}D20 Admin{% endblock %}</title>
    <style>
      body { font: 16px system-ui; max-width: 42rem; margin: 3rem auto; padding: 0 1rem; background: #17151c; color: #eee; }
      label, input, button { display: block; width: 100%; box-sizing: border-box; margin: .8rem 0; }
      input, button { padding: .7rem; }
      button { cursor: pointer; }
    </style>
  </head>
  <body>
    <main>{% block content %}{% endblock %}</main>
  </body>
</html>
